<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
        />
        <title>Kevin Neth — Portfolio</title>
        <link
            rel="stylesheet"
            href="css/style.css"
        />
    </head>
    <body>
        <header class="site-header">
            <nav class="nav">
                <h1 class="logo">KN</h1>

                <ul class="nav-links">
                    <li><a href="#projects">Projets</a></li>
                    <li><a href="#skills">Compétences</a></li>
                    <li><a href="#about">À propos</a></li>
                    <li><a href="#contact">Contact</a></li>
                </ul>
            </nav>
        </header>

        <main>
            <section id="hero"></section>

            <section id="projects">
                <h2>Projets</h2>

                <div
                    class="projects-grid"
                    id="projects-container"
                ></div>
            </section>

            <section id="skills">
                <h2>Compétences</h2>

                <div
                    class="skills-filters"
                    id="skills-filters"
                ></div>

                <div
                    class="skills-grid"
                    id="skills-container"
                ></div>
            </section>

            <section id="about">
                <h2>À propos</h2>

                <div
                    class="about-content"
                    id="about-content"
                ></div>
            </section>

            <section id="contact">
                <h2>Contact</h2>

                <form
                    id="contact-form"
                    novalidate
                >
                    <div class="form-group">
                        <label for="name">Nom</label>
                        <input
                            type="text"
                            id="name"
                        />
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                        />
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message"></textarea>
                    </div>

                    <button type="submit">Envoyer</button>

                    <p id="form-feedback"></p>
                </form>
            </section>
        </main>

        <footer class="site-footer">
            <p>© 2026 — Kevin Neth</p>
        </footer>
        <script src="js/main.js"></script>
    </body>
</html>
